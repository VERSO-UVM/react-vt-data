[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=1.5.4",
    "fastapi>=0.137.2",
    "geopandas>=1.1.3",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pyogrio>=0.12.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "shapely>=2.1.2",
    "uvicorn>=0.49.0",
    "xycmap>=1.0.1",
]


[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[dependency-groups]
dev = [
    "geopandas>=1.1.3",
    "httpx2>=2.9.1",
    "ipykernel>=7.3.0",
    "nbformat>=5.10.4",
    "plotly>=6.9.0",
    "pytest>=8.3.0",
    "ruff>=0.16.1",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "sqlfluff>=4.2.2",
]
