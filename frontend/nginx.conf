## generated largely by claude

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # unprivileged: these must live somewhere writable
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The trusted outer proxy must overwrite X-Forwarded-Proto with the public
    # scheme. Direct local requests without it keep this connection's scheme.
    map $http_x_forwarded_proto $mcp_forwarded_proto {
        default $scheme;
        http http;
        https https;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Next static export: hashed assets are immutable
        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Streamable HTTP MCP and its health route share the API backend.
        # Preserve the public Host so the MCP allowlist validates the real host.
        location ~ ^/api/mcp(?:/|$) {
            # Match Uvicorn's trusted loopback proxy address.
            proxy_pass http://127.0.0.1:6767;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $mcp_forwarded_proto;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/ {
            proxy_pass http://localhost:6767;
        }

        location / {
            try_files $uri $uri.html $uri/index.html /index.html;
        }
    }
}
