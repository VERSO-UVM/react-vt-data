name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked Python dependencies
        working-directory: backend
        run: uv sync --frozen --python 3.13
      # No warehouse.duckdb or DuckLake exists here: tests that read real data
      # are marked `requires_warehouse` and skip (see tests/conftest.py).
      # test_base.py still imports the deleted data_collection_OLD package; drop
      # the --ignore once it is ported to data_collection.base.
      - name: Run the backend test suite
        working-directory: backend
        run: uv run --frozen pytest -q --ignore=tests/test_base.py
