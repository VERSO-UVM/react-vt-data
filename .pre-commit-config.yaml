repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: frontend/node_modules/.bin/prettier --write
        files: ^frontend/.*\.(ts|tsx)$
        exclude: ^frontend/(public|out)/
